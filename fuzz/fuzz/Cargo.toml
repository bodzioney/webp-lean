[package]
name = "webp-diff-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
build = "build.rs"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
webp-diff = { path = ".." }

[[bin]]
name = "diff"
path = "fuzz_targets/diff.rs"
test = false
doc = false
bench = false

[workspace]

[profile.release]
debug = 1
